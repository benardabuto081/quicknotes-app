<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>A simple and fast app to capture your thoughts</p>
    </header>

    <main class="main-container">
        <!-- Section 1: Add a note -->
        <section class="card-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note text:</label>
                    <textarea id="note-input" placeholder="Type your note here... (max 200 characters)"></textarea>
                </div>
                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>
                <button type="submit">Add Note</button>
            </form>
            <p id="error-message" class="error-text"></p>
        </section>

        <!-- Section 2: Your notes -->
        <section class="card-section">
            <h2>Your notes</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
            <p id="note-count">You have no notes yet.</p>
            <button id="clear-all-btn" class="secondary-btn" style="display: none;">Clear all notes</button>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>
</body>
</html>
